<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Pricing Table</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .pricing-container {
      width: 95%;
      max-width: 1100px;
      text-align: center;
    }

    .toggle {
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }

    .toggle input {
      display: none;
    }

    .toggle-label {
      background: #e5e7eb;
      border-radius: 30px;
      width: 70px;
      height: 30px;
      position: relative;
      cursor: pointer;
    }

    .toggle-label::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: all 0.3s ease;
    }

    input:checked + .toggle-label::after {
      transform: translateX(40px);
      background: #3b82f6;
    }

    input:checked + .toggle-label {
      background: #93c5fd;
    }

    .pricing-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 2rem 1rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }

    .recommended {
      border: 2px solid #3b82f6;
      position: relative;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }

    .recommended::before {
      content: "Recommended";
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #3b82f6;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .card video {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .card h3 {
      margin-bottom: 0.5rem;
      font-size: 1.3rem;
    }

    .price {
      font-size: 2rem;
      color: #3b82f6;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .features {
      list-style: none;
      margin-bottom: 1.5rem;
    }

    .features li {
      margin: 0.5rem 0;
      color: #374151;
    }

    .btn {
      background: #3b82f6;
      color: white;
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #2563eb;
    }

    @media (max-width: 600px) {
      .price {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="pricing-container">
    <div class="toggle">
      <span>Monthly</span>
      <input type="checkbox" id="billingToggle" />
      <label for="billingToggle" class="toggle-label"></label>
      <span>Yearly</span>
    </div>

    <div class="pricing-cards">
      <div class="card">
        <video autoplay muted loop>
          <source src="basic.mp4" type="video/mp4" />
        </video>
        <h3>Basic</h3>
        <div class="price" data-monthly="$6/mo" data-yearly="$60/yr">$6/mo</div>
        <ul class="features">
          <li>1 video slot</li>
          <li>720p streaming</li>
          <li>Email support</li>
        </ul>
        <a href="#" class="btn">Choose Plan</a>
      </div>

      <div class="card recommended">
        <video autoplay muted loop>
          <source src="standard.mp4" type="video/mp4" />
        </video>
        <h3>Standard</h3>
        <div class="price" data-monthly="$12/mo" data-yearly="$120/yr">$12/mo</div>
        <ul class="features">
          <li>3 video slots</li>
          <li>1080p streaming</li>
          <li>Priority support</li>
        </ul>
        <a href="#" class="btn">Choose Plan</a>
      </div>

      <div class="card">
        <video autoplay muted loop>
          <source src="premium.mp4" type="video/mp4" />
        </video>
        <h3>Premium</h3>
        <div class="price" data-monthly="$24/mo" data-yearly="$240/yr">$24/mo</div>
        <ul class="features">
          <li>Unlimited videos</li>
          <li>4K streaming</li>
          <li>Phone + Priority support</li>
        </ul>
        <a href="#" class="btn">Choose Plan</a>
      </div>
    </div>
  </div>

  <script>
    const toggle = document.getElementById("billingToggle");
    const prices = document.querySelectorAll(".price");

    toggle.addEventListener("change", () => {
      prices.forEach(price => {
        price.textContent = toggle.checked
          ? price.getAttribute("data-yearly")
          : price.getAttribute("data-monthly");
      });
    });
  </script>

</body>
</html>
